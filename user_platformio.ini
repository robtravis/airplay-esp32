; Local overrides — platformio.ini already declares `extra_configs = user_platformio.ini`,
; so this is the project's documented place for board-specific settings without
; editing tracked files.

; ESP32-S3-DevKitC-1-N16R8 — stock devkit settings, console on USB Serial/JTAG
; because this board has no UART bridge chip.
[env:devkit]
extends = env:esp32s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.devkit"
; This board has no UART bridge, so both connectors are the S3's native USB.
; PlatformIO's default DTR/RTS reset would reset the chip — and therefore drop the
; very USB device esptool is mid-handshake with. Require manual download mode
; (hold BOOT, tap RST, release BOOT) and leave the chip alone before flashing.
upload_flags =
    --before=no_reset
    --after=hard_reset

[env:tembed]
extends = env:esp32s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.tembed"

; DIAGNOSTIC: PSRAM disabled, to test whether PSRAM init is what halts early boot.
[env:nopsram]
extends = env:esp32s3
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.nopsram"
build_flags =
    -Wno-maybe-uninitialized
    -Os
upload_flags =
    --before=no_reset
    --after=hard_reset

; Pin IDF to 5.5.2 — the version the project states it is tested against.
; The repo pins `espressif32 @ ^6.12.0`, which resolved to 6.13.0 and brought
; framework-espidf ~3.50503.0 (IDF 5.5.3). The firmware builds cleanly on 5.5.3
; but does not boot: no console output, LED dark, no setup AP, on two separate
; S3 boards. Upstream CI only compiles, so a 5.5.3 regression would go unnoticed.
[env:idf552]
extends = env:esp32s3
platform_packages =
    platformio/framework-espidf @ ~3.50502.0
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.devkit"
upload_flags =
    --before=no_reset
    --after=hard_reset
